plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

tasks.configureEach { task ->
    if (task instanceof Copy || task instanceof AbstractArchiveTask) {
        task.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

def runTasks = [
    runFabricClient  : ':Fabric:runClient',
    runFabricServer  : ':Fabric:runServer',
    runForgeClient   : ':Forge:runClient',
    runForgeServer   : ':Forge:runServer',
    runNeoForgeClient: ':NeoForge:runClient',
    runNeoForgeServer: ':NeoForge:runServer',
]
runTasks.each { taskName, runTask ->
    tasks.register(taskName) {
        group = 'run'
        dependsOn(runTask)
    }
}